name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: '1'
  EXPO_NO_TELEMETRY: '1'

jobs:
  checks:
    name: ${{ matrix.script }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        script: [typecheck, lint, test, verify]
    steps:

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - run: npm ci --ignore-scripts --no-audit --no-fund
      # The repository's mocked browser scripts explicitly select msedge.

      - name: Install verification browser
        if: matrix.script == 'verify'
        run: npx --no-install playwright install --with-deps msedge

      - run: npm run ${{ matrix.script }}

  android-debug:
    name: Android debug (arm64)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install native SDK packages required by React Native 0.88
        run: sdkmanager "platforms;android-37" "build-tools;37.0.0" "ndk;27.1.12297006" "cmake;3.30.5"

      - name: Generate Android project
        run: npx --no-install expo prebuild --platform android --no-install
      # This uses only the generated debug configuration, never release credentials.

      - name: Compile debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a

      - name: Confirm debug APK exists
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk
